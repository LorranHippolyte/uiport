name: Publish
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish; must match package.json on the reviewed commit"
        required: true
        type: string
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Require reviewed main commit and matching version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module -e 'import p from "./package.json" with { type: "json" }; const version = p.version; const ref = process.env.GITHUB_REF_NAME || ""; const dispatch = process.env.GITHUB_EVENT_NAME === "workflow_dispatch"; if (!dispatch && ref !== `v${version}`) process.exit(1); if (dispatch && process.env.DISPATCH_VERSION !== version) process.exit(1)'
      - name: Refuse to publish a version that already exists
        run: |
          version=$(node --input-type=module -e 'import p from "./package.json" with { type: "json" }; process.stdout.write(p.version)')
          if npm view "uiport@$version" version >/dev/null 2>&1; then
            echo "::error::uiport@$version is already published. Published versions are immutable; publish a new version instead."
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm exec -- playwright-core install --with-deps chromium
      - run: npm run check
      - name: Publish through trusted publishing (no long-lived token)
        run: npm publish --access public
