<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UIport — original responsive example</title>
  <style>
    :root { color-scheme: dark; --paper: #eef0e6; --accent: #bded7b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #111713; color: var(--paper); font-family: system-ui, sans-serif; }
    a { color: inherit; }
    #hero { padding: clamp(24px, 5vw, 80px); max-width: 1600px; margin: auto; }
    .top { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #3b443b; padding-bottom: 24px; }
    .wordmark { font-size: 23px; font-weight: 750; letter-spacing: -1px; }
    .tag { color: #b7c2b5; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; }
    .layout { display: grid; grid-template-columns: 1.2fr 1fr; align-items: center; gap: 64px; padding-block: 80px 72px; }
    .eyebrow { color: var(--accent); font: 12px ui-monospace, monospace; letter-spacing: 2px; }
    h1 { margin: 24px 0; font-size: clamp(44px, 5.6vw, 84px); line-height: 1.04; font-weight: 550; letter-spacing: -0.065em; }
    h1 span { color: var(--accent); }
    .intro { max-width: 430px; color: #b7c2b5; font-size: 17px; line-height: 1.7; }
    .button { display: inline-flex; margin-top: 24px; padding: 16px 24px; background: var(--accent); color: #15220d; border-radius: 8px; font-weight: 650; text-decoration: none; transition: background 160ms ease, transform 160ms ease; }
    .button:hover, .button:focus-visible { background: #d6ff9e; transform: translateY(-3px); outline: 2px solid white; outline-offset: 4px; }
    .art { position: relative; min-width: 0; padding: 24px; border: 1px solid #4a5649; border-radius: 18px; background: #1c271e; box-shadow: 0 28px 70px #050a0766; }
    .art img { display: block; width: 100%; border-radius: 10px; }
    .caption { display: flex; justify-content: space-between; margin-top: 24px; color: #b7c2b5; font: 11px ui-monospace,monospace; }
    .bottom { display: flex; gap: 24px; justify-content: space-between; border-top: 1px solid #3b443b; padding-top: 24px; color: #b7c2b5; font: 11px ui-monospace, monospace; }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; gap: 40px; padding-block: 48px; } .tag { letter-spacing: 0; font-size: 10px; } .bottom { flex-direction: column; gap: 12px; } }
  </style>
</head>
<body>
  <main id="hero">
    <header class="top"><span class="wordmark">UIport ↗</span><span class="tag">An original open source example</span></header>
    <div class="layout">
      <div><div class="eyebrow">FROM BROWSER TO BUILDER</div><h1>Start with<br>a section.<br><span>Make it yours.</span></h1><p class="intro">A small, editable starting point for your next idea. Capture a section, inspect the details, and keep building.</p><a class="button" href="#details">Explore the details ↗</a></div>
      <figure class="art"><img src="./section.svg" alt="Abstract green layers representing a portable web section" width="480" height="420"><figcaption class="caption"><span>HTML + CSS + ASSETS</span><span>01 / PORTABLE</span></figcaption></figure>
    </div>
    <footer class="bottom" id="details"><span>CREATED FOR UIPORT · MIT LICENSE</span><span>Local files. Your workflow.</span></footer>
  </main>
</body>
</html>
